name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash syntax and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: bash -n configs/netfilter-hardening.sh
      - name: Run ShellCheck
        run: shellcheck --shell=bash --severity=style configs/netfilter-hardening.sh
