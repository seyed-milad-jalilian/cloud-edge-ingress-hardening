name: Validate configuration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: Bash, ShellCheck, and firewall integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: make check
      - name: Run ShellCheck
        run: make lint
      - name: Run firewall integration tests
        run: make test
