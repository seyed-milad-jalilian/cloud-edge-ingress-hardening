<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Cloud edge ingress and host firewall reference architecture</title>
  <desc id="description">Clients reach an application through Cloudflare and OCI network security controls. Administrators connect from approved CIDRs. The Ubuntu host applies IPv4 and IPv6 firewall rules before traffic reaches the application.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 650; }
      .detail { font-size: 14px; fill: #475569; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .box { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">Cloud Edge Ingress &amp; Host Hardening</text>

  <rect x="42" y="170" width="172" height="100" class="box" fill="#fff" stroke="#94a3b8"/>
  <text x="128" y="211" text-anchor="middle" class="label">Remote clients</text>
  <text x="128" y="239" text-anchor="middle" class="detail">HTTPS requests</text>

  <rect x="290" y="170" width="190" height="100" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="385" y="211" text-anchor="middle" class="label">Cloudflare proxy</text>
  <text x="385" y="239" text-anchor="middle" class="detail">Published proxy CIDRs</text>

  <rect x="555" y="110" width="590" height="310" rx="22" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="850" y="145" text-anchor="middle" class="label">Oracle Cloud Infrastructure</text>

  <rect x="595" y="178" width="218" height="112" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="704" y="216" text-anchor="middle" class="label">OCI network rules</text>
  <text x="704" y="243" text-anchor="middle" class="detail">Restrict SSH and HTTPS</text>
  <text x="704" y="266" text-anchor="middle" class="detail">at the cloud boundary</text>

  <rect x="868" y="178" width="238" height="112" class="box" fill="#fce7f3" stroke="#db2777"/>
  <text x="987" y="216" text-anchor="middle" class="label">Ubuntu host firewall</text>
  <text x="987" y="243" text-anchor="middle" class="detail">Netfilter: IPv4 + IPv6</text>
  <text x="987" y="266" text-anchor="middle" class="detail">SSH allow-list; HTTPS from edge</text>

  <rect x="868" y="330" width="238" height="62" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="987" y="368" text-anchor="middle" class="label">Origin application</text>

  <rect x="595" y="330" width="218" height="62" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="704" y="357" text-anchor="middle" class="label">Administrator</text>
  <text x="704" y="379" text-anchor="middle" class="detail">Approved source CIDR</text>

  <path d="M214 220h70" class="flow"/>
  <text x="247" y="204" text-anchor="middle" class="detail">HTTPS</text>
  <path d="M480 220h105" class="flow"/>
  <text x="532" y="204" text-anchor="middle" class="detail">TCP 443</text>
  <path d="M813 234h45" class="flow"/>
  <path d="M987 290v32" class="flow"/>
  <path d="M813 361h45" class="flow"/>
  <text x="837" y="346" text-anchor="middle" class="detail">SSH</text>

  <text x="600" y="466" text-anchor="middle" class="detail">Coordinated cloud controls, host firewall policy, and application TLS protect the origin ingress path.</text>
</svg>
