# Origin-host Linux network tuning baseline.

# Disable transit routing on an Internet-facing application host.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Congestion control.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# TCP connection behavior and socket buffer limits.
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_keepalive_time = 1200
net.ipv4.tcp_rmem = 4096 87380 25000000
net.ipv4.tcp_wmem = 4096 16384 25000000
net.core.rmem_max = 25000000
net.core.wmem_max = 25000000

# SYN flood resilience.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
